<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; padding: 32px 16px; background: #eef1ea; color: #1e2925">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <tr>
              <td style="padding-bottom: 32px; font-family: Georgia, serif; font-size: 20px">
                MyCogniAI
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-bottom: 16px;
                  font-family: Georgia, serif;
                  font-size: 28px;
                  line-height: 1.2;
                "
              >
                Seu código para criar uma nova senha
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-bottom: 24px;
                  font-family: Arial, sans-serif;
                  font-size: 16px;
                  line-height: 1.6;
                  color: #5b6762;
                "
              >
                Digite este código no MyCogniAI para escolher uma nova senha. Ele vale por 1 hora.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 0;
                  border-top: 1px solid #cfd8cf;
                  border-bottom: 1px solid #cfd8cf;
                  font-family: Arial, sans-serif;
                  font-size: 36px;
                  font-weight: bold;
                  letter-spacing: 10px;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 24px;
                  font-family: Arial, sans-serif;
                  font-size: 14px;
                  line-height: 1.6;
                  color: #5b6762;
                "
              >
                Se você não pediu para trocar a senha, ignore este email. Sua senha atual continua
                valendo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

project_id = "mycogni"

[api]
enabled = false
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
port = 55329

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
port = 55323

[local_smtp]
port = 55324

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "{{ $l := printf \"%v\" .Data.locale }}{{ if or (eq $l \"en-US\") (eq $l \"en-GB\") }}Your MyCogniAI confirmation code{{ else if eq $l \"pt-PT\" }}O seu código de confirmação do MyCogniAI{{ else }}Seu código de confirmação do MyCogniAI{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ $l := printf \"%v\" .Data.locale }}{{ if or (eq $l \"en-US\") (eq $l \"en-GB\") }}Your code to choose a new password{{ else if eq $l \"pt-PT\" }}O seu código para criar uma nova palavra-passe{{ else }}Seu código para criar uma nova senha{{ end }}"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327

[remotes.staging]
project_id = "kbqfcicmszsmvbxrbcgq"

[remotes.staging.api]
enabled = false

[remotes.staging.auth]
site_url = "https://web-staging-c88c.up.railway.app"
additional_redirect_urls = [
  "https://web-staging-c88c.up.railway.app/auth/callback",
  "http://localhost:3000/auth/callback",
]
minimum_password_length = 8
password_requirements = "letters_digits"

[remotes.staging.auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[remotes.staging.auth.external.google]
enabled = false
